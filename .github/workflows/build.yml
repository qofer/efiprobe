name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: build
        shell: cmd
        run: build.bat

      - name: checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash build\efiprobe.efi -Algorithm SHA256).Hash
          "$h  efiprobe.efi" | Out-File -Encoding ascii SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: efiprobe
          path: |
            build/efiprobe.efi
            SHA256SUMS
